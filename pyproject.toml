[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph"
version = "1.0.0"
description = "Code dependency graph, architectural risk scoring, and ML code similarity with MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "neo4j>=5.14.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[project.scripts]
codegraph = "codegraph.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
